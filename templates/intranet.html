<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intranet | BCTA</title>
    <style>
        :root {
            --azul: #0a192f;
            --dorado: #c5a059;
            --gris: #f5f7fa;
            --blanco: #ffffff;
            --texto: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--gris);
            color: var(--texto);
        }

        .wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: var(--blanco);
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
            border-top: 5px solid var(--dorado);
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--azul);
            font-size: 2rem;
        }

        p {
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .estado {
            margin: 25px 0;
            padding: 16px;
            border-radius: 8px;
            background: #eef2f7;
            color: #2563eb;
            font-weight: 700;
        }

        .acciones {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            padding: 14px 22px;
            border: 1px solid var(--dorado);
            background: transparent;
            color: var(--dorado);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .btn:hover {
            background: var(--dorado);
            color: var(--azul);
        }

        .logout-form {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Intranet</h1>

            <p>
                Esta sección corresponde al acceso administrativo interno del estudio.
            </p>

            <p>
                Aquí podrán mostrarse herramientas, accesos y módulos de gestión interna.
            </p>

            <div class="estado">
                ESTADO: módulo en preparación
            </div>

            <div class="acciones">
                <a class="btn" href="/home">← Volver al inicio</a>

                <form class="logout-form" id="logout-form" method="post" action="/salir">
                    <button class="btn" type="submit">Cerrar acceso</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const logoutForm = document.getElementById("logout-form");

        if (logoutForm) {
            logoutForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                try {
                    await fetch("/salir", {
                        method: "POST",
                        credentials: "same-origin"
                    });
                } catch (error) {
                }

                window.location.href = "/";
            });
        }
    </script>
</body>
</html>
