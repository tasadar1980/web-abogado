                <img src="{{ url_for('static', filename='img/Fotos Empresa/fotos webp/altura.webp') }}" alt="Asesoría jurídica para empresas BCTA" id="mobile-m4-photo-b">

<script>
document.addEventListener("DOMContentLoaded", () => {
const root = document.querySelector(".mobile-m4");
if (!root) return;

const module3Photos = [
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/agricultura.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/altura.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/bolsa 2.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/bolsa.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/callcenter.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/condominios.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/eolicos.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/ganadería.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/industrias 2.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/industrias.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/minería 2.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/minería.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/paneles.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/personas trabajando.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/represa.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/salmoneria.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/tecnología 2.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/tecnología.webp') }}",
                        "{{ url_for('static', filename='img/Fotos Empresa/fotos webp/transmision.webp') }}"
                    ];

                    function shuffleModule3Photos(photos) {
                        for (let i = photos.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [photos[i], photos[j]] = [photos[j], photos[i]];
                        }
                    }

                    function initModule3PhotoLoop(loopId, photoAId, photoBId) {
                        const photos = [...module3Photos];
                        const photoA = root.querySelector(`#${photoAId}`);
                        const photoB = root.querySelector(`#${photoBId}`);
                        const loop = root.querySelector(`#${loopId}`);
                        let activePhoto = photoA;
                        let nextPhoto = photoB;
                        let photoIndex = 0;

                        if (!photoA || !photoB || !loop) return;

                        shuffleModule3Photos(photos);
                        photoA.src = photos[0];
                        loop.style.setProperty("--module3-loop-bg", `url("${photos[0]}")`);

                        window.setInterval(() => {
                            if (!activePhoto || !nextPhoto || photos.length < 2) return;

                            photoIndex += 1;

                            if (photoIndex >= photos.length) {
                                const lastPhoto = photos[photos.length - 1];
                                shuffleModule3Photos(photos);
                                if (photos[0] === lastPhoto && photos.length > 1) {
                                    [photos[0], photos[1]] = [photos[1], photos[0]];
                                }
                                photoIndex = 0;
                            }

                            nextPhoto.src = photos[photoIndex];
                            loop.style.setProperty("--module3-loop-bg", `url("${photos[photoIndex]}")`);
                            nextPhoto.classList.add("is-active");
                            activePhoto.classList.remove("is-active");

                            [activePhoto, nextPhoto] = [nextPhoto, activePhoto];
                        }, 3500);
                    }
                    initModule3PhotoLoop("mobile-m4-photo-loop", "mobile-m4-photo-a", "mobile-m4-photo-b");
});
</script>
