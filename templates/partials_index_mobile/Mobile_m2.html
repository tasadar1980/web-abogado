<script>
document.addEventListener("DOMContentLoaded", () => {
    const root = document.querySelector(".mobile-m2");
    if (!root) return;

    const module2Photos = [
        "{{ url_for('static', filename='img/Fotos webp mod2/abuelos 1.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/abuelos 2.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/conductor.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/familia 1.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/Madre hijo.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/muletas.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/padre e Hija.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/pareja 1.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/pareja 2.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/trabajador 1.webp') }}",
        "{{ url_for('static', filename='img/Fotos webp mod2/trabajador 2.webp') }}"
    ];

    function shuffleModule2Photos(photos) {
        for (let i = photos.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [photos[i], photos[j]] = [photos[j], photos[i]];
        }
    }

    function initModule2PhotoLoop(loopId, photoAId, photoBId) {
        const photos = [...module2Photos];
        const photoA = root.querySelector(`#${photoAId}`);
        const photoB = root.querySelector(`#${photoBId}`);
        const loop = root.querySelector(`#${loopId}`);
        let activePhoto = photoA;
        let nextPhoto = photoB;
        let photoIndex = 0;

        if (!photoA || !photoB || !loop) return;

        shuffleModule2Photos(photos);
        photoA.src = photos[0];
        loop.style.setProperty("--module2-loop-bg", `url("${photos[0]}")`);

        window.setInterval(() => {
            if (!activePhoto || !nextPhoto || photos.length < 2) return;

            photoIndex += 1;

            if (photoIndex >= photos.length) {
                const lastPhoto = photos[photos.length - 1];
                shuffleModule2Photos(photos);
                if (photos[0] === lastPhoto && photos.length > 1) {
                    [photos[0], photos[1]] = [photos[1], photos[0]];
                }
                photoIndex = 0;
            }

            nextPhoto.src = photos[photoIndex];
            loop.style.setProperty("--module2-loop-bg", `url("${photos[photoIndex]}")`);
            nextPhoto.classList.add("is-active");
            activePhoto.classList.remove("is-active");

            [activePhoto, nextPhoto] = [nextPhoto, activePhoto];
        }, 3500);
    }

    initModule2PhotoLoop("mobile-m2-photo-loop", "mobile-m2-photo-a", "mobile-m2-photo-b");
});
</script>
