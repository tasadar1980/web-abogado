<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>{% block title %}BCTA | Bufete César Toloza & Asociados{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --azul-premium: #0a192f;
            --azul-secundario: #112240;
            --dorado-firma: #c5a059;
            --verde-bcta: #55635A;
            --verde-bcta-oscuro: #445048;
            --gris-suave: #f5f7fa;
            --blanco: #ffffff;
            --texto-claro: #ccd6f6;
            --texto-oscuro: #1f2937;
            --gris-linea: #e5e7eb;
            --sombra: 0 15px 35px rgba(0, 0, 0, 0.12);
            --radio: 10px;
            --ancho-max: 1200px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
            color: var(--texto-oscuro);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: min(92%, var(--ancho-max));
            margin: 0 auto;
        }

        .mobile-landscape-lock {
            display: none;
        }

        @keyframes internalPageEnter {
            from {
                opacity: 0;
                transform: translateX(-18px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        body:not(.home-page) > main,
        body:not(.home-page) > .nosotros-page,
        body:not(.home-page) > .usuarios-page,
        body:not(.home-page) > .intranet-page {
            animation: internalPageEnter 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* =========================
           HEADER L&S STYLE
           ========================= */
        @keyframes headerFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ls-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
            z-index: 1000;
            background: transparent;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.45s ease;
        }

        .ls-header.init-anim {
            animation: headerFadeIn 1.15s cubic-bezier(0.22, 1, 0.36, 1) both;
            will-change: opacity, transform;
        }

        body:not(.home-page) .ls-header.init-anim {
            animation-delay: 120ms;
        }

        .ls-header.is-scrolling {
            opacity: 0;
        }

        /* Ajuste de Navbar específico para el slider de inicio */
        body.home-page .ls-header {
            transition: opacity 600ms cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.home-page .ls-header .brand-logo-static,
        body.home-page .ls-header .ls-menu-btn {
            transition:
                filter 650ms cubic-bezier(0.25, 1, 0.5, 1),
                color 650ms cubic-bezier(0.25, 1, 0.5, 1),
                opacity 300ms ease;
        }

        .ls-header.is-module-two .brand-logo-static {
            filter: brightness(0) saturate(100%) invert(8%) sepia(30%) saturate(2400%) hue-rotate(185deg) brightness(92%) contrast(102%);
        }

        .ls-header.is-module-two .ls-menu-btn {
            color: #0A192F;
        }

        /* Contraste del Navbar en páginas claras (Nosotros y Portal de Clientes) */
        body.nosotros-page .ls-header .brand-logo-static,
        body.usuarios-page .ls-header .brand-logo-static,
        body.intranet-page .ls-header .brand-logo-static {
            filter: brightness(0) saturate(100%) invert(8%) sepia(30%) saturate(2400%) hue-rotate(185deg) brightness(92%) contrast(102%);
        }

        body.nosotros-page .ls-header .ls-menu-btn,
        body.usuarios-page .ls-header .ls-menu-btn,
        body.intranet-page .ls-header .ls-menu-btn {
            color: #0A192F;
        }

        .ls-header-left,
        .ls-header-right {
            pointer-events: auto;
        }

        .brand-logo-static {
            height: 45px;
            width: auto;
            filter: brightness(0) invert(1);
            transition: filter 0.4s ease;
        }

        #base-logo img {
            filter: brightness(0) invert(1);
        }

        .ls-menu-btn {
            background: transparent;
            color: #fff;
            border: none;
            border-radius: 0;
            padding: 10px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            transition: opacity 0.3s ease, color 0.4s ease;
        }

        .ls-menu-btn:hover {
            opacity: 0.75;
        }

        .ls-menu-btn span {
            display: none;
        }

        .ls-menu-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ls-menu-icon i {
            display: block;
            width: 24px;
            height: 2px;
            background: currentColor;
            border-radius: 999px;
        }

        /* =========================
           OFF-CANVAS MENU
           ========================= */
        .ls-offcanvas {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: rgba(10, 25, 47, 0.94);
            backdrop-filter: blur(6px);
            z-index: 2000;
            transition: right 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            flex-direction: column;
            padding: 60px 50px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .ls-offcanvas.active {
            right: 0;
        }

        .ls-close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .ls-close-btn:hover {
            color: var(--dorado-firma);
        }

        .ls-offcanvas-nav {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .ls-offcanvas-nav a {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            text-decoration: none;
            transition: color 0.3s;
        }

        .ls-offcanvas-nav a:hover {
            color: var(--dorado-firma);
        }

        .ls-offcanvas-nav .ls-nav-cta {
            margin-top: 30px;
            font-size: 1.2rem;
            color: var(--dorado-firma);
            border: 1px solid var(--dorado-firma);
            padding: 15px 30px;
            border-radius: 30px;
            text-align: center;
            font-weight: 600;
        }

        .ls-offcanvas-nav .ls-nav-cta:hover {
            background: var(--dorado-firma);
            color: var(--azul-premium);
        }

        .ls-offcanvas-nav .ls-nav-main {
            white-space: nowrap;
            font-size: clamp(2.15rem, 2.2vw, 2.5rem);
        }

        /* =========================
           FOOTER L&S STYLE
           ========================= */
        .ls-footer {
            background: var(--azul-premium);
            color: #fff;
            padding: 12px 40px 8px;
            margin-top: auto;
        }

        .ls-footer-inner {
            display: grid;
            grid-template-columns: 1.15fr 0.75fr 0.75fr 0.85fr 0.85fr;
            align-items: center;
            gap: 22px;
            padding-bottom: 6px;
            margin-bottom: 2px;
        }

        .ls-footer-brand {
            max-width: 210px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-self: start;
        }

        .ls-footer-logo {
            height: 56px;
            margin-bottom: 3px;
            filter: brightness(0) invert(1);
        }

        .ls-footer-claim {
            display: block;
            width: 112px;
            max-width: 100%;
            height: auto;
            margin: 0;
        }

        .ls-footer-links {
            display: contents;
        }

        .ls-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
            align-items: flex-start;
        }

        .ls-col a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            transition: color 0.3s;
        }

        .ls-col a:hover {
            color: var(--dorado-firma);
        }

        .ls-social-links {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }

        .ls-social-links a {
            font-size: 1.2rem;
            opacity: 0.8;
            transition: opacity 0.3s, color 0.3s;
        }

        .ls-social-links a:hover {
            opacity: 1;
            color: var(--dorado-firma);
        }

        .ls-footer-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
            padding-top: 0;
        }

        body.home-page .ls-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 900;
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            transition:
                opacity 1800ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 1800ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.home-page.is-home-slide-4 .ls-footer {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* =========================
           RESPONSIVE BASE
           ========================= */
        @media (min-width: 981px) and (max-width: 1536px), (min-width: 981px) and (max-height: 900px) {
            .ls-header {
                padding: clamp(22px, 2.4vh, 28px) clamp(28px, 2.6vw, 36px);
            }

            .brand-logo-static {
                height: clamp(38px, 4.8vh, 43px);
            }

            .ls-offcanvas {
                max-width: 460px;
                padding: clamp(46px, 6vh, 56px) clamp(38px, 4vw, 46px);
            }

            .ls-close-btn {
                top: 24px;
                right: 34px;
                font-size: 2.25rem;
            }

            .ls-offcanvas-nav {
                margin-top: clamp(44px, 6vh, 56px);
                gap: clamp(18px, 2.6vh, 24px);
            }

            .ls-offcanvas-nav .ls-nav-main {
                font-size: clamp(1.9rem, 2.2vw, 2.32rem);
            }

            .ls-offcanvas-nav .ls-nav-cta {
                margin-top: 18px;
                padding: 13px 26px;
                font-size: 1.05rem;
            }

            .ls-footer {
                padding: 9px 34px 7px;
            }

            .ls-footer-inner {
                gap: 18px;
                padding-bottom: 4px;
            }

            .ls-footer-brand {
                max-width: 190px;
            }

            .ls-footer-logo {
                height: 48px;
                margin-bottom: 2px;
            }

            .ls-footer-claim {
                width: 98px;
            }

            .ls-col {
                gap: 4px;
            }

            .ls-col a {
                font-size: 0.82rem;
            }

            .ls-footer-bottom {
                font-size: 0.72rem;
            }
        }

        @media (min-width: 981px) and (max-width: 1400px) and (max-height: 800px) {
            .ls-header {
                padding: 20px 30px;
            }

            .brand-logo-static {
                height: 36px;
            }

            .ls-footer {
                padding: 7px 30px 5px;
            }

            .ls-footer-logo {
                height: 42px;
            }

            .ls-footer-claim {
                width: 88px;
            }

            .ls-footer-inner {
                gap: 14px;
                padding-bottom: 2px;
            }

            .ls-col a {
                font-size: 0.76rem;
            }
        }

        @media (max-width: 768px) {
            .ls-header {
                padding: 20px;
                background: transparent;
                box-shadow: none;
                backdrop-filter: none;
            }

            .ls-header .brand-logo-static,
            .ls-header.is-module-two .brand-logo-static,
            body.nosotros-page .ls-header .brand-logo-static,
            body.usuarios-page .ls-header .brand-logo-static,
            body.intranet-page .ls-header .brand-logo-static {
                -webkit-filter: none !important;
                filter: none !important;
                opacity: 1;
            }

            .ls-header .ls-menu-btn,
            .ls-header.is-module-two .ls-menu-btn,
            body.nosotros-page .ls-header .ls-menu-btn,
            body.usuarios-page .ls-header .ls-menu-btn,
            body.intranet-page .ls-header .ls-menu-btn {
                color: #fff !important;
                opacity: 1;
            }

            .ls-menu-icon i {
                background: #fff;
                opacity: 1;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 8px rgba(10, 25, 47, 0.26);
            }

            body.home-page .ls-header {
                transition: opacity 520ms cubic-bezier(0.22, 1, 0.36, 1);
            }

            body.home-page.is-home-transitioning .ls-header {
                opacity: 1;
                pointer-events: auto;
            }

            body.home-page.is-home-slide-2 .ls-header .brand-logo-static,
            body.home-page.is-home-mobile-slide-2 .ls-header .brand-logo-static,
            body.home-page.is-home-mobile-slide-3 .ls-header .brand-logo-static {
                -webkit-filter: brightness(0) saturate(100%) invert(8%) sepia(30%) saturate(2400%) hue-rotate(185deg) brightness(92%) contrast(102%) !important;
                filter: brightness(0) saturate(100%) invert(8%) sepia(30%) saturate(2400%) hue-rotate(185deg) brightness(92%) contrast(102%) !important;
                opacity: 1 !important;
            }

            body.home-page.is-home-slide-2 .ls-header .ls-menu-btn,
            body.home-page.is-home-mobile-slide-2 .ls-header .ls-menu-btn,
            body.home-page.is-home-mobile-slide-3 .ls-header .ls-menu-btn {
                color: #0A192F !important;
            }

            body.home-page.is-home-slide-2 .ls-menu-icon i,
            body.home-page.is-home-mobile-slide-2 .ls-menu-icon i,
            body.home-page.is-home-mobile-slide-3 .ls-menu-icon i {
                background: currentColor;
                box-shadow: none;
            }

            body.home-page .ls-footer {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 900;
                opacity: 0;
                transform: translateY(16px);
                pointer-events: none;
            }

            body.home-page.is-home-mobile-slide-6 .ls-footer {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }

            .ls-offcanvas {
                padding: 40px 24px;
            }

            .ls-offcanvas-nav {
                gap: 20px;
            }

            .ls-offcanvas-nav a {
                font-size: 2rem;
            }

            .ls-offcanvas-nav .ls-nav-main {
                font-size: clamp(1.55rem, 7.2vw, 1.9rem);
                line-height: 1.08;
                white-space: normal;
            }

            .ls-footer-inner {
                grid-template-columns: 1fr;
                gap: 14px;
                align-items: center;
                justify-items: center;
                text-align: center;
            }

            .ls-footer-brand {
                justify-self: center;
                align-items: center;
                text-align: center;
            }

            .ls-footer-links {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px 18px;
                align-items: start;
                justify-items: center;
            }

            .ls-footer-links .ls-col {
                align-items: center;
                text-align: center;
                gap: 4px;
            }

            .ls-footer-links .ls-col:nth-child(4) {
                grid-column: 1 / -1;
                justify-self: center;
                margin-top: 2px;
            }

            .ls-footer {
                padding: 18px 20px 12px;
            }

            .ls-footer-logo {
                height: 58px;
            }

            .ls-footer-claim {
                width: 112px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body:not(.home-page) > main,
            body:not(.home-page) > .nosotros-page,
            body:not(.home-page) > .usuarios-page,
            body:not(.home-page) > .intranet-page {
                animation: none;
            }
        }

        @media (max-width: 920px) and (orientation: landscape) and (pointer: coarse) {
            body {
                overflow: hidden !important;
            }

            .mobile-landscape-lock {
                position: fixed;
                inset: 0;
                z-index: 5000;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                padding: clamp(14px, 4vw, 28px);
                background:
                    radial-gradient(circle at 18% 12%, rgba(197, 160, 89, 0.10), transparent 30%),
                    linear-gradient(145deg, var(--azul-premium), var(--azul-secundario));
                overflow: hidden;
            }

            .mobile-landscape-lock img {
                display: block;
                width: min(68vw, 560px);
                max-height: 64vh;
                height: auto;
                object-fit: contain;
            }
        }

    </style>
</head>

<body class="{% block body_class %}{% endblock %}">
    <div class="mobile-landscape-lock" aria-hidden="true">
        <img
            src="{{ url_for('static', filename='img/bcta_landscape_notice.svg') }}"
            alt=""
            width="760"
            height="430"
            decoding="async"
        >
    </div>

    <header class="ls-header init-anim">
        <div class="ls-header-left">
            {% block header_logo %}
            <a href="/home" aria-label="Ir al inicio de BCTA Abogados">
                <picture>
                    <source media="(max-width: 768px)" srcset="{{ url_for('static', filename='img/Logo BCTA Vertical Blanco V1.svg') }}">
                    <img src="{{ url_for('static', filename='img/Logo BCTA Vertical V1.svg') }}" alt="BCTA Abogados"
                        class="brand-logo-static">
                </picture>
            </a>

            {% endblock %}
        </div>
        <div class="ls-header-right">
            <button class="ls-menu-btn" id="ls-menu-btn">
                <span>Menú</span>
                <div class="ls-menu-icon">
                    <i></i><i></i><i></i>

                </div>
            </button>
        </div>
    </header>

    <div class="ls-offcanvas" id="ls-offcanvas">
        <button class="ls-close-btn" id="ls-close-btn">&times;</button>
        <nav class="ls-offcanvas-nav">
            <a href="/home" class="ls-nav-main">Inicio</a>
            <a href="/nosotros" class="ls-nav-main">Nosotros</a>

            <a href="/servicios" class="ls-nav-main">Servicios</a>
            <a href="/contacto" class="ls-nav-main">Contacto</a>
            <a href="/legal" class="ls-nav-main">Política de Privacidad</a>
            <a href="/usuarios" class="ls-nav-cta">Acceso Usuarios</a>
            <a href="/intranet" class="ls-nav-cta">Acceso Intranet</a>
        </nav>
    </div>

    {% block content %}
    {% endblock %}

    {% block footer %}
    <footer class="ls-footer">
        <div class="container ls-footer-inner">
            <div class="ls-footer-brand">
                <img src="{{ url_for('static', filename='img/Logo BCTA Vertical V1.svg') }}" alt="BCTA Abogados"
                    class="ls-footer-logo">
                <img src="{{ url_for('static', filename='img/Pasion con fondo.svg') }}" alt="Pasión por el derecho"
                    class="ls-footer-claim">
            </div>
            <div class="ls-footer-links">
                <div class="ls-col">
                    <a href="/home">Inicio</a>
                    <a href="/nosotros">Nosotros</a>
                </div>
                <div class="ls-col">
                    <a href="/servicios">Servicios</a>
                    <a href="/contacto">Contacto</a>
                </div>
                <div class="ls-col">
                    <a href="https://www.linkedin.com/company/112255680/" target="_blank">LinkedIn</a>
                    <a href="https://www.instagram.com/bcta_abogados/" target="_blank">Instagram</a>
                </div>
                <div class="ls-col">
                    <a href="/legal">Política de Privacidad</a>
                </div>
            </div>
        </div>
        <div class="container ls-footer-bottom">
            <div class="ls-copy">© 2026 BCTA Abogados.</div>
        </div>
    </footer>
    {% endblock %}


    <script>
        const publicReloadHomePaths = ["/servicios", "/nosotros", "/contacto", "/usuarios", "/intranet", "/legal", "/info"];
        const navigationEntry = performance.getEntriesByType("navigation")[0];
        const isReloadNavigation =
            (navigationEntry && navigationEntry.type === "reload") ||
            (performance.navigation && performance.navigation.type === 1);

        if (
            isReloadNavigation &&
            publicReloadHomePaths.includes(window.location.pathname)
        ) {
            window.location.replace("/home");
        }

        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        window.addEventListener('pageshow', () => {
            if (!window.location.hash) {
                window.scrollTo(0, 0);
            }
        });

        const menuBtn = document.getElementById("ls-menu-btn");
        const closeBtn = document.getElementById("ls-close-btn");
        const offcanvas = document.getElementById("ls-offcanvas");

        const header = document.querySelector(".ls-header");
        if (header) {
            header.addEventListener("animationend", (e) => {
                if (e.animationName === "headerFadeIn") {
                    header.classList.remove("init-anim");
                }
            });
        }

        if (menuBtn && closeBtn && offcanvas) {
            menuBtn.addEventListener("click", () => {
                offcanvas.classList.add("active");
            });
            closeBtn.addEventListener("click", () => {
                offcanvas.classList.remove("active");
            });
            document.addEventListener("click", (event) => {
                if (
                    offcanvas.classList.contains("active") &&
                    !offcanvas.contains(event.target) &&
                    !menuBtn.contains(event.target)
                ) {
                    offcanvas.classList.remove("active");
                }
            });
        }

        const moduleTwoSection = document.getElementById("snap-section-2");
        const isHomeDeck = document.body.classList.contains("home-page");
        let scrollTimer = null;

        function syncModuleTwoHeaderColor() {
            if (isHomeDeck) return;
            if (!header || !moduleTwoSection) return;

            const rect = moduleTwoSection.getBoundingClientRect();
            const viewportCenter = window.innerHeight / 2;
            const isModuleTwoActive = rect.top <= viewportCenter && rect.bottom >= viewportCenter;

            header.classList.toggle("is-module-two", isModuleTwoActive);
        }

        if (!isHomeDeck) {
            syncModuleTwoHeaderColor();
            window.addEventListener("resize", syncModuleTwoHeaderColor, { passive: true });
        }

        window.addEventListener("scroll", () => {
            if (isHomeDeck) return;
            if (!header || offcanvas.classList.contains("active")) return;

            syncModuleTwoHeaderColor();
            header.classList.add("is-scrolling");

            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                header.classList.remove("is-scrolling");
            }, 220);
        }, { passive: true });
    </script>
</body>

</html>
